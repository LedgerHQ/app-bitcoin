name: Codegen check

# Ensures the generated files committed to the repo are in sync with the specs
# they are derived from:
#  - the BIP388 cleartext files, generated from specs/bip388/*.toml
#  - the BIP-322 unit-test vectors, generated from specs/bip322/basic-test-vectors.json
# If someone edits a spec without re-running the corresponding gen.py, this job
# fails and points at the drifted files.

on:
  workflow_dispatch:
  push:
    branches:
      - master
      - develop
  pull_request:

jobs:
  check_cleartext_codegen:
    name: Check generated cleartext files are up to date
    runs-on: ubuntu-latest

    steps:
      - name: Clone
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          # 3.11+ for the stdlib tomllib used by gen.py.
          python-version: '3.12'

      - name: Check codegen is in sync with the TOML specs
        run: python3 specs/bip388/gen.py --check

      - name: Check the BIP-322 unit-test vectors are in sync with the pinned JSON
        run: python3 specs/bip322/gen.py --check
