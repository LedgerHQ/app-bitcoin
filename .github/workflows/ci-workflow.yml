name: CI

on:
  workflow_dispatch:
  push:
    branches:
    - master
    - develop
    tags:
    - '*'
  pull_request:
    branches:
    - master
    - develop

jobs:
  job_build:
    name: Compilation for X, S+, Stax, Flex and Apex P

    strategy:
      matrix:
        include:
          - model: nanox
            SDK: "$NANOX_SDK"
          - model: nanosp
            SDK: "$NANOSP_SDK"
          - model: stax
            SDK: "$STAX_SDK"
          - model: flex
            SDK: "$FLEX_SDK"
          - model: apex_p
            SDK: "$APEX_P_SDK"

    runs-on: ubuntu-latest

    container:
      image: ghcr.io/ledgerhq/ledger-app-builder/ledger-app-builder:latest

    steps:
      - name: Clone
        uses: actions/checkout@v4

      - name: Build
        run: |
          make DEBUG=0 COIN=bitcoin BOLOS_SDK=${{ matrix.SDK }} && mv bin/ bitcoin-bin/
          make clean
          make DEBUG=0 COIN=bitcoin_testnet BOLOS_SDK=${{ matrix.SDK }} && mv bin/ bitcoin-testnet-bin/
      - name: Upload Bitcoin app binary
        uses: actions/upload-artifact@v4
        with:
          name: bitcoin-app-${{ matrix.model }}
          path: bitcoin-bin

      - name: Upload Bitcoin Testnet app binary
        uses: actions/upload-artifact@v4
        with:
          name: bitcoin-testnet-app-${{ matrix.model }}
          path: bitcoin-testnet-bin

  job_build_app_perftest:
    name: Compile the UX-less version of the app on Nano S+ for performance tests

    runs-on: ubuntu-latest

    container:
      image: ghcr.io/ledgerhq/ledger-app-builder/ledger-app-builder:latest

    steps:
      - name: Clone
        uses: actions/checkout@v4

      - name: Build
        run: |
          make DEBUG=0 COIN=bitcoin_testnet BOLOS_SDK="$NANOSP_SDK" AUTOAPPROVE_FOR_PERF_TESTS=1

      - name: Upload Bitcoin Testnet app binary
        uses: actions/upload-artifact@v4
        with:
          name: bitcoin-testnet-perftest-app-nanosp
          path: bin

  job_test_mainnet:
    name: Tests on mainnet
    strategy:
      matrix:
        include:
          - model: nanox
          - model: nanosp
          - model: stax
          - model: flex
          - model: apex_p

    needs: job_build
    runs-on: ubuntu-latest

    container:
      image: ghcr.io/ledgerhq/ledger-app-builder/ledger-app-dev-tools:latest

    steps:
      - name: Clone
        uses: actions/checkout@v4

      - name: Download Bitcoin app binary
        uses: actions/download-artifact@v4
        with:
          name: bitcoin-app-${{matrix.model}}
          path: bin

      - name: Run tests
        run: |
          # The image's venv is only activated for interactive bash shells
          . "$VENV_PATH/bin/activate"
          pip install -r requirements.txt
          cd tests_mainnet
          pytest --headless --model=${{ matrix.model }} --timeout=300

  job_perftests:
    name: Performance report

    needs: job_build_app_perftest
    runs-on: ubuntu-latest

    container:
      image: ghcr.io/ledgerhq/ledger-app-builder/ledger-app-dev-tools:latest

    steps:
      - name: Clone
        uses: actions/checkout@v4

      - name: Download Bitcoin app binary for perftests
        uses: actions/download-artifact@v4
        with:
          name: bitcoin-testnet-perftest-app-nanosp
          path: bin

      - name: Run tests
        run: |
          # The image's venv is only activated for interactive bash shells
          . "$VENV_PATH/bin/activate"
          pip install -r requirements.txt
          cd tests_perf
          pytest --headless --model=nanosp --benchmark-json=benchmarks.json
      - name: Upload benchmarks summary
        uses: actions/upload-artifact@v4
        with:
          name: benchmarks-log
          path: tests_perf/benchmarks.json

  validate_release_tag:
    name: Validate client release tag
    if: github.event_name == 'push' && (startsWith(github.ref, 'refs/tags/pyclient') || startsWith(github.ref, 'refs/tags/jsclient') || startsWith(github.ref, 'refs/tags/rsclient'))
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Clone
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check tag format, package version and ancestry
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! "$GITHUB_REF_NAME" =~ ^(pyclient|jsclient|rsclient)-([0-9]+\.[0-9]+\.[0-9]+)$ ]]; then
              echo "[ERROR] Malformed release tag: $GITHUB_REF_NAME"
              exit 1
          fi
          component="${BASH_REMATCH[1]}"
          tag_version="${BASH_REMATCH[2]}"
          case "$component" in
              pyclient)
                  package_version=$(grep -m1 -E '^version = ' bitcoin_client_rs/bindings/python/Cargo.toml | sed -E 's/^version = "(.*)"$/\1/') ;;
              jsclient)
                  package_version=$(node -p "require('./bitcoin_client_rs/bindings/js/package.json').version") ;;
              rsclient)
                  package_version=$(grep -m1 -E '^version = ' bitcoin_client_rs/Cargo.toml | sed -E 's/^version = "(.*)"$/\1/') ;;
          esac
          if [[ "$package_version" != "$tag_version" ]]; then
              echo "[ERROR] Tag version $tag_version does not match package version $package_version"
              exit 1
          fi
          git fetch --no-tags origin master:refs/remotes/origin/master develop:refs/remotes/origin/develop
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/master && ! git merge-base --is-ancestor "$GITHUB_SHA" origin/develop; then
              echo "[ERROR] Tagged commit $GITHUB_SHA is not part of master or develop"
              exit 1
          fi
          echo "[INFO] Release tag $GITHUB_REF_NAME validated"

  check_ragger_tests:
    name: Check that ragger tests passed on the tagged commit
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/pyclient-')
    runs-on: ubuntu-latest
    permissions:
      actions: read

    steps:
      - name: Check ragger_tests result in build_and_functional_tests.yml
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          run_ids=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/build_and_functional_tests.yml/runs?head_sha=$GITHUB_SHA&event=push&status=completed" --jq '.workflow_runs[].id')
          for run_id in $run_ids; do
              results=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$run_id/jobs?filter=latest&per_page=100" \
                  --jq '.jobs[] | select(.name | startswith("Run ragger tests using the reusable workflow / Functional tests with Ragger (")) | .conclusion')
              if [[ -n "$results" ]] && ! grep -qv '^success$' <<< "$results"; then
                  echo "[INFO] Ragger tests passed in run $run_id"
                  exit 0
              fi
          done
          echo "[ERROR] No completed push run of build_and_functional_tests.yml with successful ragger tests for $GITHUB_SHA"
          exit 1

  job_test_python_client:
    name: Python client
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.13"]
    # actions/setup-python has no Python 3.9 for the Ubuntu of ubuntu-latest (26.04)
    runs-on: ubuntu-24.04

    steps:
      - name: Clone
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Build and install the package
        run: pip install ./bitcoin_client_rs/bindings/python pytest "mnemonic>=0.20,<0.21" "bip32>=3.4,<4.0"

      - name: Run tests
        run: |
          pytest bitcoin_client_rs/bindings/python/tests
          # the Bitcoin primitives of the test suites
          pytest test_utils/bitcoin/tests

  job_build_python_wheels:
    name: Python client wheels (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - name: Clone
        uses: actions/checkout@v4

      - name: Build the abi3 wheel
        uses: PyO3/maturin-action@v1
        with:
          working-directory: bitcoin_client_rs/bindings/python
          # no --release: it would override the size-optimized profile set in pyproject.toml
          args: --out dist
          manylinux: auto

      - name: Upload the wheel
        uses: actions/upload-artifact@v4
        with:
          name: python-client-wheel-${{ matrix.os }}
          path: bitcoin_client_rs/bindings/python/dist

  build_pypi_image:
    name: Build the environment in which the Python package is built for PyPI
    needs: [validate_release_tag]
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/pyclient-')
    runs-on: ubuntu-latest

    steps:
      - name: Clone
        uses: actions/checkout@v4

      - name: Build the image
        run: |
          docker build -t ledger-bitcoin-pypi -f .github/workflows/pypi-build.Dockerfile .github/workflows
          docker save -o /tmp/pypi-build-image.tar ledger-bitcoin-pypi

      - name: Upload the image
        uses: actions/upload-artifact@v4
        with:
          name: pypi-build-image
          path: /tmp/pypi-build-image.tar

  python_package_and_deploy:
    name: Build and deploy the bitcoin client Python package
    needs: [validate_release_tag, check_ragger_tests, job_test_python_client, build_pypi_image]
    uses: LedgerHQ/ledger-app-workflows/.github/workflows/reusable_pypi_deployment.yml@v1
    if: success() && github.event_name == 'push' && startsWith(github.ref, 'refs/tags/pyclient-')
    with:
      package_name: ledger_bitcoin
      # the package is built with maturin from the Rust client, in a manylinux image with a Rust
      # toolchain (see pypi-build.Dockerfile): the sdist, and a manylinux x86_64 wheel
      package_directory: ./bitcoin_client_rs/bindings/python/
      docker_image_artifact: pypi-build-image
      release: false
      publish: true

  job_test_js_lib:
    name: Tests with the JS library
    needs: job_build
    runs-on: ubuntu-latest

    container:
      image: ghcr.io/ledgerhq/ledger-app-builder/ledger-app-dev-tools:latest

    defaults:
      run:
        working-directory: bitcoin_client_rs/bindings/js

    steps:
      - name: Clone
        uses: actions/checkout@v4

      - name: Install node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install the wasm-bindgen CLI
        uses: taiki-e/install-action@v2
        with:
          tool: wasm-bindgen-cli@0.2.105

      - name: Download Bitcoin Testnet app binary
        uses: actions/download-artifact@v4
        with:
          name: bitcoin-testnet-app-nanosp
          path: bin

      - name: Build
        run: |
          npm ci
          npm run build
          npm run lint

      - name: Run tests
        run: LOG_SPECULOS=1 LOG_APDUS=1 SPECULOS=speculos npm test

  deploy_js_client:
    name: Deploy
    needs: [validate_release_tag, job_test_js_lib]
    uses: LedgerHQ/ledger-app-workflows/.github/workflows/reusable_npm_deployment.yml@v1
    if: success() && github.event_name == 'push' && startsWith(github.ref, 'refs/tags/jsclient-')
    with:
      # building the package needs a Rust toolchain, see scripts/build-wasm.sh
      package_directory: "bitcoin_client_rs/bindings/js"

  job_test_rust_client:
    name: Rust client
    runs-on: ubuntu-latest
    timeout-minutes: 30

    defaults:
      run:
        working-directory: bitcoin_client_rs

    env:
      CARGO_INCREMENTAL: 0

    container:
      image: ghcr.io/ledgerhq/ledger-app-builder/ledger-app-builder:latest

    steps:
      - name: Clone
        uses: actions/checkout@v4

      - name: Install WASM target
        run: rustup target add wasm32-unknown-unknown

      # Each `cargo test` also runs the doctests.
      - name: Test without features
        run: cargo test --locked -p ledger_bitcoin_client --no-default-features

      - name: Test paranoid_client
        run: cargo test --locked -p ledger_bitcoin_client --no-default-features --features paranoid_client

      - name: Test client
        run: cargo test --locked -p ledger_bitcoin_client --no-default-features --features client

      - name: Test client and paranoid_client
        run: cargo test --locked -p ledger_bitcoin_client --no-default-features --features client,paranoid_client

      - name: Test async
        run: cargo test --locked -p ledger_bitcoin_client --no-default-features --features async

      - name: Test default features (async and paranoid_client)
        run: cargo test --locked -p ledger_bitcoin_client

      - name: Check pure WASM
        run: cargo check --locked -p ledger_bitcoin_client --no-default-features --target wasm32-unknown-unknown

      - name: Check paranoid WASM
        run: cargo check --locked -p ledger_bitcoin_client --no-default-features --features paranoid_client --target wasm32-unknown-unknown

      - name: Test the operations shared by the bindings
        run: cargo test --locked -p ledger_bitcoin_client_bindings

  # Separate from the tests, which the release depends on: a new lint in the image's toolchain
  # fails this job, but does not block a release.
  job_lint_rust_client:
    name: Rust client lints
    runs-on: ubuntu-latest
    timeout-minutes: 30

    defaults:
      run:
        working-directory: bitcoin_client_rs

    env:
      CARGO_INCREMENTAL: 0
      RUSTDOCFLAGS: -D warnings

    container:
      image: ghcr.io/ledgerhq/ledger-app-builder/ledger-app-builder:latest

    steps:
      - name: Clone
        uses: actions/checkout@v4

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Clippy, denying warnings in every feature combination
        run: |
          for features in "" paranoid_client client client,paranoid_client async async,paranoid_client; do
            echo "Features: ${features:-none}"
            cargo clippy --locked -p ledger_bitcoin_client --all-targets --no-default-features --features "$features" -- -D warnings
          done

      - name: Check documentation in every feature combination
        run: |
          for features in "" paranoid_client client client,paranoid_client async async,paranoid_client; do
            echo "Features: ${features:-none}"
            cargo doc --locked -p ledger_bitcoin_client --no-deps --no-default-features --features "$features"
          done

      - name: Install WASM target
        run: rustup target add wasm32-unknown-unknown

      - name: Clippy for the bindings, denying warnings
        run: |
          cargo clippy --locked -p ledger_bitcoin_client_bindings -p ledger_bitcoin_python --all-targets -- -D warnings
          cargo clippy --locked -p ledger_bitcoin_wasm --target wasm32-unknown-unknown -- -D warnings

  deploy_rust_client:
    name: Deploy rust client library
    needs: [validate_release_tag, job_test_rust_client]
    if: success() && github.event_name == 'push' && startsWith(github.ref, 'refs/tags/rsclient-')
    uses: LedgerHQ/ledger-app-workflows/.github/workflows/reusable_crates_deployment.yml@v1
    with:
      package_directory: "bitcoin_client_rs"
      publish: true
      release: false
