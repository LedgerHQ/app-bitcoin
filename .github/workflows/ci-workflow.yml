name: CI

on:
  workflow_dispatch:
  push:
    branches:
    - master
    - develop
    tags:
    - '*'
  pull_request:
    branches:
    - master
    - develop

jobs:
  job_build:
    name: Compilation for X, S+, Stax, Flex and Apex P

    strategy:
      matrix:
        include:
          - model: nanox
            SDK: "$NANOX_SDK"
          - model: nanosp
            SDK: "$NANOSP_SDK"
          - model: stax
            SDK: "$STAX_SDK"
          - model: flex
            SDK: "$FLEX_SDK"
          - model: apex_p
            SDK: "$APEX_P_SDK"

    runs-on: ubuntu-latest

    container:
      image: ghcr.io/ledgerhq/ledger-app-builder/ledger-app-builder:latest

    steps:
      - name: Clone
        uses: actions/checkout@v4

      - name: Build
        run: |
          make DEBUG=0 COIN=bitcoin BOLOS_SDK=${{ matrix.SDK }} && mv bin/ bitcoin-bin/
          make clean
          make DEBUG=0 COIN=bitcoin_testnet BOLOS_SDK=${{ matrix.SDK }} && mv bin/ bitcoin-testnet-bin/
      - name: Upload Bitcoin app binary
        uses: actions/upload-artifact@v4
        with:
          name: bitcoin-app-${{ matrix.model }}
          path: bitcoin-bin

      - name: Upload Bitcoin Testnet app binary
        uses: actions/upload-artifact@v4
        with:
          name: bitcoin-testnet-app-${{ matrix.model }}
          path: bitcoin-testnet-bin

  job_build_app_perftest:
    name: Compile the UX-less version of the app on Nano S+ for performance tests

    runs-on: ubuntu-latest

    container:
      image: ghcr.io/ledgerhq/ledger-app-builder/ledger-app-builder:latest

    steps:
      - name: Clone
        uses: actions/checkout@v4

      - name: Build
        run: |
          make DEBUG=0 COIN=bitcoin_testnet BOLOS_SDK="$NANOSP_SDK" AUTOAPPROVE_FOR_PERF_TESTS=1

      - name: Upload Bitcoin Testnet app binary
        uses: actions/upload-artifact@v4
        with:
          name: bitcoin-testnet-perftest-app-nanosp
          path: bin

  job_test_mainnet:
    name: Tests on mainnet
    strategy:
      matrix:
        include:
          - model: nanox
          - model: nanosp
          - model: stax
          - model: flex
          - model: apex_p

    needs: job_build
    runs-on: ubuntu-latest

    container:
      image: ghcr.io/ledgerhq/speculos:latest
      options: --entrypoint /bin/bash

    steps:
      - name: Clone
        uses: actions/checkout@v4

      - name: Download Bitcoin app binary
        uses: actions/download-artifact@v4
        with:
          name: bitcoin-app-${{matrix.model}}
          path: bin

      - name: Install build dependencies
        run: apt update && apt install -y build-essential

      - name: Run tests
        run: |
          pip install -r requirements.txt
          cd tests_mainnet
          PYTHONPATH=$PYTHONPATH:/speculos pytest --headless --model=${{ matrix.model }} --timeout=300

  job_test_python_lib_legacyapp:
    name: Tests with the Python library and legacy Bitcoin app
    needs: job_build
    runs-on: ubuntu-latest

    container:
      # As for the test we use v1.6.5 Nano S BTC binary we freeze the last Speculos version supporting this device
      image: ghcr.io/ledgerhq/speculos:0.25.5
      options: --entrypoint /bin/bash

    steps:
      - name: Clone
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: apt update && apt install -y build-essential

      - name: Run tests
        run: |
          pip install -r requirements.txt
          cd bitcoin_client/tests
          PYTHONPATH=$PYTHONPATH:/speculos pytest --headless --timeout=300 --model=nanos

  job_perftests:
    name: Performance report

    needs: job_build_app_perftest
    runs-on: ubuntu-latest

    container:
      image: ghcr.io/ledgerhq/speculos:latest
      options: --entrypoint /bin/bash

    steps:
      - name: Clone
        uses: actions/checkout@v4

      - name: Download Bitcoin app binary for perftests
        uses: actions/download-artifact@v4
        with:
          name: bitcoin-testnet-perftest-app-nanosp
          path: bin

      - name: Install build dependencies
        run: apt update && apt install -y build-essential

      - name: Run tests
        run: |
          pip install -r requirements.txt
          cd tests_perf
          PYTHONPATH=$PYTHONPATH:/speculos pytest --headless --model=nanosp --benchmark-json=benchmarks.json
      - name: Upload benchmarks summary
        uses: actions/upload-artifact@v4
        with:
          name: benchmarks-log
          path: tests_perf/benchmarks.json

  validate_release_tag:
    name: Validate client release tag
    if: github.event_name == 'push' && (startsWith(github.ref, 'refs/tags/pyclient') || startsWith(github.ref, 'refs/tags/jsclient') || startsWith(github.ref, 'refs/tags/rsclient'))
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Clone
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check tag format, package version and ancestry
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! "$GITHUB_REF_NAME" =~ ^(pyclient|jsclient|rsclient)-([0-9]+\.[0-9]+\.[0-9]+)$ ]]; then
              echo "[ERROR] Malformed release tag: $GITHUB_REF_NAME"
              exit 1
          fi
          component="${BASH_REMATCH[1]}"
          tag_version="${BASH_REMATCH[2]}"
          case "$component" in
              pyclient)
                  package_version=$(grep -m1 -E "^__version__ = " bitcoin_client/ledger_bitcoin/__init__.py | sed -E "s/^__version__ = ['\"](.*)['\"]$/\1/") ;;
              jsclient)
                  package_version=$(node -p "require('./bitcoin_client_js/package.json').version") ;;
              rsclient)
                  package_version=$(grep -m1 -E '^version = ' bitcoin_client_rs/Cargo.toml | sed -E 's/^version = "(.*)"$/\1/') ;;
          esac
          if [[ "$package_version" != "$tag_version" ]]; then
              echo "[ERROR] Tag version $tag_version does not match package version $package_version"
              exit 1
          fi
          git fetch --no-tags origin master:refs/remotes/origin/master develop:refs/remotes/origin/develop
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/master && ! git merge-base --is-ancestor "$GITHUB_SHA" origin/develop; then
              echo "[ERROR] Tagged commit $GITHUB_SHA is not part of master or develop"
              exit 1
          fi
          echo "[INFO] Release tag $GITHUB_REF_NAME validated"

  check_ragger_tests:
    name: Check that ragger tests passed on the tagged commit
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/pyclient-')
    runs-on: ubuntu-latest
    permissions:
      actions: read

    steps:
      - name: Check ragger_tests result in build_and_functional_tests.yml
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          run_ids=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/build_and_functional_tests.yml/runs?head_sha=$GITHUB_SHA&event=push&status=completed" --jq '.workflow_runs[].id')
          for run_id in $run_ids; do
              results=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$run_id/jobs?filter=latest&per_page=100" \
                  --jq '.jobs[] | select(.name | startswith("Run ragger tests using the reusable workflow / Functional tests with Ragger (")) | .conclusion')
              if [[ -n "$results" ]] && ! grep -qv '^success$' <<< "$results"; then
                  echo "[INFO] Ragger tests passed in run $run_id"
                  exit 0
              fi
          done
          echo "[ERROR] No completed push run of build_and_functional_tests.yml with successful ragger tests for $GITHUB_SHA"
          exit 1

  python_package_and_deploy:
    name: Build and deploy the bitcoin client Python package
    needs: [validate_release_tag, check_ragger_tests]
    uses: LedgerHQ/ledger-app-workflows/.github/workflows/reusable_pypi_deployment.yml@v1
    if: success() && github.event_name == 'push' && startsWith(github.ref, 'refs/tags/pyclient-')
    with:
      package_name: ledger_bitcoin
      package_directory: ./bitcoin_client/
      release: false
      publish: true

  job_test_js_lib:
    name: Tests with the JS library
    needs: job_build
    runs-on: ubuntu-latest

    container:
      image: ghcr.io/ledgerhq/speculos:latest
      options: --entrypoint /bin/bash

    steps:
      - name: Clone
        uses: actions/checkout@v4

      - name: Install node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install yarn
        run: |
          npm install -g yarn

      - name: Download Bitcoin Testnet app binary
        uses: actions/download-artifact@v4
        with:
          name: bitcoin-testnet-app-nanosp
          path: bin

      - name: Run tests
        run: |
          cd bitcoin_client_js
          yarn install --immutable
          LOG_SPECULOS=1 LOG_APDUS=1 SPECULOS="/speculos/speculos.py" yarn test

  deploy_js_client:
    name: Deploy
    needs: [validate_release_tag, job_test_js_lib]
    uses: LedgerHQ/ledger-app-workflows/.github/workflows/reusable_npm_deployment.yml@v1
    if: success() && github.event_name == 'push' && startsWith(github.ref, 'refs/tags/jsclient-')
    with:
      package_directory: "bitcoin_client_js"

  job_test_rust_client:
    name: Tests for rust client library
    needs: job_build
    runs-on: ubuntu-latest

    container:
      image: ghcr.io/ledgerhq/ledger-app-builder/ledger-app-builder:latest

    steps:
      - name: Clone
        uses: actions/checkout@v4

      - name: Run tests
        run: |
          cd bitcoin_client_rs/
          cargo test --no-default-features --features="async"

  deploy_rust_client:
    name: Deploy rust client library
    needs: [validate_release_tag, job_test_rust_client]
    if: success() && github.event_name == 'push' && startsWith(github.ref, 'refs/tags/rsclient-')
    uses: LedgerHQ/ledger-app-workflows/.github/workflows/reusable_crates_deployment.yml@v1
    with:
      package_directory: "bitcoin_client_rs"
      publish: true
      release: false
