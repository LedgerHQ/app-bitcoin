[package]
name = "ledger_bitcoin_python"
version = "1.0.0"
authors = ["Ledger"]
edition = "2021"
description = "Python bindings of the Ledger Bitcoin application client"
license = "Apache-2.0"
publish = false

[lib]
name = "_native"
crate-type = ["cdylib"]

[dependencies]
ledger_bitcoin_client = { path = "../..", default-features = false, features = ["paranoid_client"] }
ledger_bitcoin_client_bindings = { path = "../common" }
pyo3 = { version = "0.30", features = ["abi3-py39"] }
# not a direct dependency: enables the small precomputed tables of the secp256k1 library that the
# client depends on, instead of about 1 MB of tables to speed up signature verification
secp256k1 = { version = "0.29", default-features = false, features = ["lowmemory"] }
