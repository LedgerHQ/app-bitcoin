[package]
name = "ledger_bitcoin_client_bindings"
version = "0.1.0"
authors = ["Ledger"]
edition = "2021"
description = "Transport-free operations of the Ledger Bitcoin client, shared by its language bindings"
license = "Apache-2.0"
publish = false

[dependencies]
bitcoin = { version = "0.32", default-features = false, features = ["std"] }
ledger_bitcoin_client = { path = "../..", default-features = false, features = ["paranoid_client"] }

[dev-dependencies]
base64 = "0.13.0"
hex = "0.4.3"
serde_json = "1.0"
